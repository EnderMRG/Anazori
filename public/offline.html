<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2b8f85" />
    <title>CivicSense is offline</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; background: #f7f8fb; color: #192433; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 380px; padding: 28px; border: 1px solid #e8ecf2; border-radius: 16px; background: #fff; text-align: center; box-shadow: 0 10px 30px #24324812; }
      h1 { margin: 0 0 10px; font-size: 24px; }
      p { margin: 0; color: #647184; line-height: 1.6; font-size: 14px; }
      button { margin-top: 20px; padding: 11px 16px; border: 0; border-radius: 8px; color: #fff; background: #2b8f85; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>CivicSense is offline</h1>
      <p>Your saved app shell is available, but this page needs an internet connection to load the latest campus data.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
